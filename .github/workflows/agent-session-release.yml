name: agent-session build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew update && brew install bash fish xcbeautify swiftly
      - run: swiftly init --skip-install --assume-yes && swiftly install
      - run: ./build-release.sh --codesign-identity -
      - uses: actions/upload-artifact@v4
        with:
          name: aerospace-agent-session-macos
          path: .release/AeroSpace-v0.0.0-SNAPSHOT.zip
          if-no-files-found: error
